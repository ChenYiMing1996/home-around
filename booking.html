<!doctype  html>
<html  lang="zh-Hant">
<head>
<meta  charset="utf-8"  />
<meta  name="viewport"  content="width=device-width,  initial-scale=1"  />
<title>訂房 — Home Around Taiwan Tours</title>
<style>
  :root  {
    --bg:        oklch(96.5%  0.012  80);
    --surface:    oklch(100%  0  0);
    --cream:      oklch(98%  0.05  95);
    --fg:        oklch(20%  0.012  60);
    --brown:      oklch(34%  0.018  60);
    --muted:      oklch(48%  0.012  60);
    --border:    oklch(82%  0.008  60);
    --hairline:  oklch(82%  0.008  60  /  0.7);
    --teal:      oklch(67%  0.09  185);
    --yellow:    oklch(82%  0.16  88);
    --green:      oklch(74%  0.13  130);
    --error:      oklch(58%  0.18  28);

    --font-display:  'Noto  Serif  TC',  'Tiempos  Headline',  'Newsreader',  'Iowan  Old  Style',  Georgia,  serif;
    --font-body:    'Noto  Sans  TC',  -apple-system,  BlinkMacSystemFont,  'Inter',  'Microsoft  JhengHei',  system-ui,  sans-serif;
    --font-mono:    ui-monospace,  'JetBrains  Mono',  'IBM  Plex  Mono',  Menlo,  monospace;

    --maxw:  1280px;
    --pad-x:  clamp(20px,  4vw,  48px);
    --section-y:  clamp(48px,  6vw,  80px);
  }
  *  {  box-sizing:  border-box;  }
  html,  body  {  margin:  0;  padding:  0;  }
  body  {
    font-family:  var(--font-body);
    color:  var(--fg);  background:  var(--bg);
    font-size:  17px;  line-height:  1.65;
    -webkit-font-smoothing:  antialiased;  text-rendering:  optimizeLegibility;
  }
  img  {  display:  block;  max-width:  100%;  }
  a  {  color:  inherit;  text-decoration:  none;  }
  button  {  font-family:  inherit;  cursor:  pointer;  }
  .num  {  font-variant-numeric:  tabular-nums;  }

  .container  {  max-width:  var(--maxw);  margin:  0  auto;  padding-inline:  var(--pad-x);  }

  /*    NAV    */
  .nav  {
    position:  sticky;  top:  0;  z-index:  50;
    background:  color-mix(in  oklch,  var(--bg)  88%,  transparent);
    backdrop-filter:  blur(14px)  saturate(140%);
    -webkit-backdrop-filter:  blur(14px)  saturate(140%);
    border-bottom:  1px  solid  var(--hairline);
  }
  .nav-inner  {  display:  flex;  align-items:  center;  height:  96px;  gap:  28px;  }
  .nav-logo  {  display:  flex;  align-items:  center;  gap:  10px;  flex-shrink:  0;  margin-right:  12px;  }
  .nav-logo  img  {  height:  66px;  width:  auto;  }
  .nav-links  {
    display:  flex;  align-items:  center;  gap:  18px;  font-size:  13.5px;
    color:  var(--brown);  white-space:  nowrap;  flex:  1;  min-width:  0;
  }
  .nav-links  a  {  position:  relative;  padding:  6px  0;  transition:  color  .2s  ease-out;  }
  .nav-links  a:hover  {  color:  var(--teal);  }
  .nav-links  a.active  {  color:  var(--brown);  }
  .nav-links  a.active::after  {
    content:  "";  position:  absolute;  left:  0;  right:  0;  bottom:  -2px;
    height:  1.5px;  background:  var(--brown);
  }
  .nav-cta  {  display:  flex;  align-items:  center;  gap:  14px;  flex-shrink:  0;  }
  /*  隤蝢斤  home  /  hotel-detail  梁閬死  */
  .nav-lang  {  display:  inline-flex;  align-items:  center;  gap:  0;  font-family:  var(--font-mono);  font-size:  11.5px;  letter-spacing:  0.08em;  color:  var(--muted);  }
  .nav-lang  .sep  {  margin:  0  4px;  opacity:  0.5;  pointer-events:  none;  }
  .lang-btn  {
    background:  transparent;  border:  0;  padding:  4px  4px;
    font:  inherit;  color:  var(--muted);  cursor:  pointer;
    line-height:  1;  border-radius:  3px;
    transition:  color  .15s  ease-out;
  }
  .lang-btn:hover  {  color:  var(--brown);  }
  .lang-btn:focus-visible  {  outline:  2px  solid  var(--teal);  outline-offset:  2px;  }
  .lang-btn.is-active  {  color:  var(--brown);  font-weight:  700;  }
  .btn  {
    display:  inline-flex;  align-items:  center;  gap:  8px;
    height:  44px;  padding:  0  22px;  border-radius:  10px;
    font-size:  14.5px;  font-weight:  600;
    border:  1px  solid  transparent;
    transition:  all  .2s  ease-out;
  }
  .btn-primary  {  background:  var(--yellow);  color:  var(--fg);  }
  .btn-primary:hover  {  transform:  translateY(-1px);  box-shadow:  0  4px  16px  -6px  oklch(82%  0.16  88  /  0.6);  }
  .btn-ghost  {  background:  transparent;  color:  var(--brown);  border-color:  var(--border);  }
  .btn-ghost:hover  {  border-color:  var(--brown);  }
  @media  (max-width:  1280px)  {
    .nav-links  {  gap:  14px;  font-size:  13px;  }
  }
  @media  (max-width:  1024px)  {
    .nav-links  {  gap:  12px;  font-size:  12.5px;  }
    .nav-lang  {  display:  none;  }
  }
  @media  (max-width:  640px)  {
    .nav-inner  {  height:  76px;  }
    .nav-logo  img  {  height:  52px;  }
    .nav-links  {  display:  none;  }
  }

  /*    BREADCRUMB    */
  .breadcrumb  {
    padding:  24px  0  12px;
    font-family:  var(--font-mono);
    font-size:  11.5px;  letter-spacing:  0.12em;
    text-transform:  uppercase;  color:  var(--muted);
  }
  .breadcrumb  a:hover  {  color:  var(--teal);  }
  .breadcrumb  .sep  {  margin:  0  8px;  opacity:  0.5;  }

  .booking-shell  {
    max-width:  var(--maxw);
    margin:  0  auto;
    padding-inline:  var(--pad-x);
  }

  /*    HEADER    */
  .head  {  padding:  16px  0  36px;  max-width:  760px;  }
  .head  .eyebrow  {
    font-family:  var(--font-mono);
    font-size:  11.5px;  letter-spacing:  0.2em;
    text-transform:  uppercase;  color:  var(--teal);
    margin-bottom:  14px;
  }
  .head  h1  {
    font-family:  var(--font-display);
    font-weight:  500;
    font-size:  clamp(32px,  4.4vw,  52px);
    line-height:  1.05;  letter-spacing:  -0.01em;
    margin:  0  0  14px;  color:  var(--brown);
    text-wrap:  balance;
  }
  .head  .deck  {
    font-size:  18px;  line-height:  1.55;  color:  var(--muted);
    max-width:  620px;  margin:  0;
  }

  /*    BODY  GRID    */
  .body-grid  {
    display:  grid;  grid-template-columns:  1.55fr  1fr;  gap:  56px;
    padding-bottom:  var(--section-y);
    align-items:  start;
  }
  @media  (max-width:  1024px)  {  .body-grid  {  grid-template-columns:  1fr;  gap:  36px;  }  }

  /*    FORM    */
  .form-card  {
    background:  var(--surface);
    border:  1px  solid  var(--border);
    border-radius:  14px;
    padding:  clamp(24px,  3vw,  40px);
  }
  .form-section  {  margin-bottom:  32px;  }
  .form-section:last-child  {  margin-bottom:  0;  }
  .form-section  h2  {
    font-family:  var(--font-display);
    font-size:  22px;  font-weight:  500;
    margin:  0  0  6px;  color:  var(--brown);
    letter-spacing:  -0.005em;
  }
  .form-section  .section-en  {
    font-family:  var(--font-mono);  font-size:  11px;
    letter-spacing:  0.18em;  text-transform:  uppercase;
    color:  var(--muted);  margin-bottom:  22px;
  }
  .form-row  {  display:  grid;  grid-template-columns:  1fr  1fr;  gap:  16px;  margin-bottom:  16px;  }
  .form-row.single  {  grid-template-columns:  1fr;  }
  @media  (max-width:  640px)  {  .form-row  {  grid-template-columns:  1fr;  }  }

  .field  {  display:  flex;  flex-direction:  column;  gap:  6px;  }
  .field  label  {
    font-size:  13px;  font-weight:  500;  color:  var(--brown);
    letter-spacing:  0.01em;
  }
  .field  label  .req  {  color:  var(--error);  margin-left:  2px;  }
  .field  input,  .field  select,  .field  textarea  {
    font-family:  inherit;
    font-size:  15px;  color:  var(--fg);
    background:  var(--bg);
    border:  1px  solid  var(--border);  border-radius:  8px;
    padding:  11px  14px;
    transition:  border-color  .15s  ease-out,  background  .15s  ease-out;
    width:  100%;
  }
  .field  textarea  {  min-height:  100px;  resize:  vertical;  line-height:  1.5;  font-family:  var(--font-body);  }
  .field  input:focus,  .field  select:focus,  .field  textarea:focus  {
    outline:  none;  border-color:  var(--teal);  background:  var(--surface);
  }
  .field  .hint  {
    font-size:  12px;  color:  var(--muted);
    font-family:  var(--font-mono);  letter-spacing:  0.04em;
    margin-top:  2px;
  }
  .field.error  input,  .field.error  select,  .field.error  textarea  {  border-color:  var(--error);  }
  .field  .err-msg  {  display:  none;  font-size:  12px;  color:  var(--error);  }
  .field.error  .err-msg  {  display:  block;  }

  /*  dropdown  native  */
  select  {
    appearance:  none;  -webkit-appearance:  none;
    background-image:  url("data:image/svg+xml;utf8,<svg  xmlns='http://www.w3.org/2000/svg'  width='10'  height='6'  viewBox='0  0  10  6'><path  fill='none'  stroke='%2358504a'  stroke-width='1.5'  d='M1  1l4  4  4-4'/></svg>");
    background-repeat:  no-repeat;
    background-position:  right  14px  center;
    padding-right:  38px;
  }

  /*  counter  */
  .counter  {
    display:  flex;  align-items:  center;  gap:  0;
    border:  1px  solid  var(--border);  border-radius:  8px;
    background:  var(--bg);  height:  44px;  width:  fit-content;
  }
  .counter  button  {
    width:  40px;  height:  100%;
    background:  transparent;  border:  0;
    color:  var(--brown);  font-size:  18px;  font-weight:  500;
    transition:  background  .15s  ease-out;
  }
  .counter  button:hover:not(:disabled)  {  background:  color-mix(in  oklch,  var(--teal)  12%,  transparent);  color:  var(--teal);  }
  .counter  button:disabled  {  color:  var(--border);  cursor:  not-allowed;  }
  .counter  .cv  {
    min-width:  44px;  text-align:  center;
    font-variant-numeric:  tabular-nums;  font-weight:  500;
    color:  var(--brown);
  }

  /*  segmented  control  */
  .seg  {
    display:  inline-flex;
    border:  1px  solid  var(--border);  border-radius:  8px;
    background:  var(--bg);  padding:  3px;  gap:  2px;
  }
  .seg  label  {
    font-size:  13.5px;  padding:  7px  14px;
    color:  var(--muted);  cursor:  pointer;
    border-radius:  6px;
    transition:  all  .15s  ease-out;
  }
  .seg  input[type="radio"]  {  display:  none;  }
  .seg  input[type="radio"]:checked  +  label  {
    background:  var(--surface);  color:  var(--brown);
    box-shadow:  0  1px  3px  oklch(20%  0.012  60  /  0.08);
  }

  /*  form  footer  */
  .form-foot  {
    margin-top:  28px;  padding-top:  24px;
    border-top:  1px  solid  var(--hairline);
    display:  flex;  flex-direction:  column;  gap:  14px;
  }
  .submit-btn  {
    height:  52px;  padding:  0  28px;
    background:  var(--yellow);  color:  var(--fg);
    border:  0;  border-radius:  10px;
    font-size:  16px;  font-weight:  600;
    transition:  all  .2s  ease-out;
    display:  inline-flex;  align-items:  center;  justify-content:  center;  gap:  10px;
  }
  .submit-btn:hover  {  transform:  translateY(-1px);  box-shadow:  0  6px  20px  -6px  oklch(82%  0.16  88  /  0.55);  }
  .submit-btn:active  {  transform:  translateY(0);  }
  .submit-btn  .arr  {  transition:  transform  .2s  ease-out;  }
  .submit-btn:hover  .arr  {  transform:  translateX(3px);  }
  .demo-note  {
    font-size:  12px;  color:  var(--muted);  line-height:  1.55;
    font-family:  var(--font-mono);  letter-spacing:  0.02em;
    text-align:  center;
  }

  /*    SUMMARY  (right)    */
  .summary  {
    position:  sticky;  top:  116px;
    background:  var(--cream);
    border:  1px  solid  var(--border);
    border-radius:  14px;
    padding:  clamp(22px,  2.6vw,  32px);
  }
  @media  (max-width:  1024px)  {  .summary  {  position:  static;  }  }
  .summary  .label-head  {
    font-family:  var(--font-mono);
    font-size:  11px;  letter-spacing:  0.2em;
    text-transform:  uppercase;  color:  var(--teal);
    margin-bottom:  14px;
  }
  .summary  h3  {
    font-family:  var(--font-display);
    font-weight:  500;  font-size:  24px;  line-height:  1.15;
    margin:  0  0  4px;  color:  var(--brown);
    letter-spacing:  -0.005em;
  }
  .summary  .h-en  {  font-family:  var(--font-mono);  font-size:  11.5px;  color:  var(--muted);  letter-spacing:  0.06em;  margin-bottom:  22px;  }
  .summary  .row  {
    display:  flex;  justify-content:  space-between;  align-items:  baseline;
    padding:  10px  0;
    border-bottom:  1px  solid  var(--hairline);
    font-size:  14px;
  }
  .summary  .row:last-of-type  {  border-bottom:  0;  }
  .summary  .row  .k  {  color:  var(--muted);  }
  .summary  .row  .v  {  color:  var(--brown);  font-weight:  500;  text-align:  right;  max-width:  60%;  }
  .summary  .row  .v.num  {  font-variant-numeric:  tabular-nums;  }
  .summary  .total  {
    margin-top:  18px;  padding-top:  18px;
    border-top:  1.5px  solid  var(--brown);
    display:  flex;  justify-content:  space-between;  align-items:  baseline;
  }
  .summary  .total  .k  {  font-size:  14px;  color:  var(--brown);  font-weight:  500;  }
  .summary  .total  .v  {
    font-family:  var(--font-display);
    font-size:  28px;  font-weight:  500;  color:  var(--brown);
    font-variant-numeric:  tabular-nums;
  }
  .summary  .total  sup  {  font-size:  13px;  opacity:  0.7;  margin-right:  2px;  }
  .summary  .breakdown  {
    background:  var(--surface);
    border:  1px  solid  var(--hairline);
    border-radius:  8px;
    padding:  14px  16px;
    margin:  18px  0  0;
    font-size:  13px;  line-height:  1.7;
    color:  var(--muted);
  }
  .summary  .breakdown  b  {  color:  var(--brown);  font-weight:  500;  }

  .empty-state  {
    text-align:  center;  padding:  18px  0;
    color:  var(--muted);  font-size:  14px;  line-height:  1.6;
  }
  .empty-state  .ic  {
    font-family:  var(--font-display);
    font-size:  36px;  color:  var(--teal);  margin-bottom:  8px;
    line-height:  1;  opacity:  0.5;
  }

  /*    SUCCESS  STATE    */
  .success  {
    max-width:  720px;  margin:  0  auto;
    padding:  clamp(48px,  6vw,  72px)  0;
    text-align:  center;
  }
  .success  .check  {
    width:  72px;  height:  72px;
    border-radius:  50%;
    background:  color-mix(in  oklch,  var(--green)  18%,  transparent);
    color:  var(--green);
    display:  inline-flex;  align-items:  center;  justify-content:  center;
    font-size:  36px;  line-height:  1;
    margin-bottom:  24px;
  }
  .success  .eyebrow  {
    font-family:  var(--font-mono);
    font-size:  11.5px;  letter-spacing:  0.2em;
    text-transform:  uppercase;  color:  var(--teal);
    margin-bottom:  14px;
  }
  .success  h1  {
    font-family:  var(--font-display);
    font-weight:  500;
    font-size:  clamp(32px,  4.2vw,  48px);
    line-height:  1.1;  margin:  0  0  14px;
    color:  var(--brown);
    letter-spacing:  -0.01em;
  }
  .success  .deck  {
    font-size:  17px;  color:  var(--muted);
    max-width:  540px;  margin:  0  auto  32px;
    line-height:  1.6;
  }
  .order-card  {
    background:  var(--surface);
    border:  1px  solid  var(--border);
    border-radius:  14px;
    padding:  28px;
    text-align:  left;
    margin-bottom:  32px;
  }
  .order-card  .order-id  {
    font-family:  var(--font-mono);
    font-size:  12px;  letter-spacing:  0.16em;
    color:  var(--muted);  margin-bottom:  4px;
  }
  .order-card  .order-id  b  {  color:  var(--brown);  font-weight:  500;  }
  .order-card  h2  {
    font-family:  var(--font-display);
    font-size:  22px;  font-weight:  500;
    margin:  0  0  18px;  color:  var(--brown);
    letter-spacing:  -0.005em;
  }
  .order-card  .o-row  {
    display:  flex;  justify-content:  space-between;
    padding:  9px  0;  font-size:  14px;
    border-bottom:  1px  solid  var(--hairline);
  }
  .order-card  .o-row:last-of-type  {  border-bottom:  0;  }
  .order-card  .o-row  .k  {  color:  var(--muted);  }
  .order-card  .o-row  .v  {  color:  var(--brown);  font-weight:  500;  text-align:  right;  }
  .order-card  .o-total  {
    display:  flex;  justify-content:  space-between;  align-items:  baseline;
    margin-top:  16px;  padding-top:  16px;
    border-top:  1.5px  solid  var(--brown);
  }
  .order-card  .o-total  .k  {  font-size:  14px;  color:  var(--brown);  }
  .order-card  .o-total  .v  {
    font-family:  var(--font-display);
    font-size:  26px;  font-weight:  500;  color:  var(--brown);
    font-variant-numeric:  tabular-nums;
  }
  .next-steps  {
    background:  var(--cream);
    border:  1px  solid  var(--border);
    border-radius:  12px;
    padding:  22px  26px;
    text-align:  left;
    margin-bottom:  28px;
  }
  .next-steps  h3  {
    font-family:  var(--font-display);
    font-size:  17px;  font-weight:  500;
    margin:  0  0  12px;  color:  var(--brown);
  }
  .next-steps  ol  {
    margin:  0;  padding-left:  20px;
    font-size:  14.5px;  line-height:  1.75;  color:  var(--brown);
  }
  .next-steps  ol  li::marker  {  color:  var(--teal);  font-family:  var(--font-mono);  }
  .success-cta  {  display:  flex;  gap:  12px;  justify-content:  center;  flex-wrap:  wrap;  }

  /*    FOOTER    */
  .footer  {
    background:  var(--brown);  color:  oklch(96%  0.012  80);
    padding:  56px  0  36px;  margin-top:  var(--section-y);
  }
  .footer-inner  {  display:  grid;  grid-template-columns:  1.4fr  1fr  1fr  1fr;  gap:  40px;  }
  @media  (max-width:  900px)  {  .footer-inner  {  grid-template-columns:  1fr  1fr;  }  }
  @media  (max-width:  600px)  {  .footer-inner  {  grid-template-columns:  1fr;  gap:  28px;  }  }
  .footer  h4  {  font-family:  var(--font-display);  font-size:  14px;  font-weight:  500;  margin:  0  0  14px;  opacity:  0.7;  letter-spacing:  0.04em;  }
  .footer  ul  {  list-style:  none;  margin:  0;  padding:  0;  }
  .footer  li  {  padding:  4px  0;  font-size:  13.5px;  opacity:  0.85;  }
  .footer  li  a:hover  {  opacity:  1;  text-decoration:  underline;  }
  .footer-logo  img  {  height:  84px;  width:  auto;  margin-bottom:  14px;  filter:  brightness(0)  invert(1)  opacity(0.95);  }
  .footer-tag  {  font-size:  13px;  line-height:  1.6;  opacity:  0.7;  max-width:  280px;  }
  .footer-bottom  {
    margin-top:  44px;  padding-top:  22px;
    border-top:  1px  solid  oklch(60%  0.018  60  /  0.3);
    display:  flex;  justify-content:  space-between;

      '<div class="form-row single"><div class="field"><label for="f-room">'+esc(t('bk.field.room'))+'<span class="req">*</span></label><select id="f-room" name="room" required disabled><option value="">'+esc(t('bk.field.room.placeholder'))+'</option></select><span class="err-msg">'+esc(t('bk.field.room.placeholder'))+'</span></div></div>'+
      '<div class="form-row"><div class="field"><label for="f-checkin">'+esc(t('bk.field.checkin'))+'<span class="req">*</span></label><input type="date" id="f-checkin" name="checkin" required min="'+fmt(today)+'" value="'+fmt(ci)+'" /></div><div class="field"><label for="f-checkout">'+esc(t('bk.field.checkout'))+'<span class="req">*</span></label><input type="date" id="f-checkout" name="checkout" required min="'+fmt(today)+'" value="'+fmt(co)+'" /></div></div>'+
      '<div class="form-row"><div class="field"><label>'+esc(t('bk.field.adults'))+'</label><div class="counter" data-counter="adults" data-min="1" data-max="8"><button type="button" data-step="-1" aria-label="'+esc(t('bk.aria.minus'))+'">-</button><span class="cv" id="cv-adults">'+adults+'</span><button type="button" data-step="1" aria-label="'+esc(t('bk.aria.plus'))+'">+</button></div><input type="hidden" id="f-adults" name="adults" value="'+adults+'" /></div><div class="field"><label>'+esc(t('bk.field.children'))+' <span class="hint" style="font-family:inherit;letter-spacing:0;font-size:11px;color:var(--muted);">'+esc(t('bk.field.children.hint'))+'</span></label><div class="counter" data-counter="kids" data-min="0" data-max="6"><button type="button" data-step="-1" aria-label="'+esc(t('bk.aria.minus'))+'">-</button><span class="cv" id="cv-kids">'+kids+'</span><button type="button" data-step="1" aria-label="'+esc(t('bk.aria.plus'))+'">+</button></div><input type="hidden" id="f-kids" name="kids" value="'+kids+'" /></div></div>'+
      '<div class="form-row single"><div class="field"><label>'+esc(t('bk.field.voucher'))+'</label><div class="seg" role="radiogroup" aria-label="'+esc(t('bk.voucher.aria'))+'"><input type="radio" name="voucher" id="v-1" value="refined" checked /><label for="v-1">'+esc(t('bk.voucher.refined'))+'</label><input type="radio" name="voucher" id="v-2" value="boutique" /><label for="v-2">'+esc(t('bk.voucher.boutique'))+'</label><input type="radio" name="voucher" id="v-3" value="cash" /><label for="v-3">'+esc(t('bk.voucher.cash'))+'</label></div></div></div></div>'+
      '<div class="form-section"><h2>'+esc(t('bk.section.contact'))+'</h2><div class="section-en">CONTACT</div><div class="form-row"><div class="field"><label for="f-name">'+esc(t('bk.field.name'))+'<span class="req">*</span></label><input type="text" id="f-name" name="name" required autocomplete="name" placeholder="'+esc(t('bk.field.name.placeholder'))+'" /></div><div class="field"><label for="f-phone">'+esc(t('bk.field.phone'))+'<span class="req">*</span></label><input type="tel" id="f-phone" name="phone" required autocomplete="tel" inputmode="tel" placeholder="'+esc(t('bk.field.phone.placeholder'))+'" /></div></div><div class="form-row single"><div class="field"><label for="f-email">'+esc(t('bk.field.email'))+'</label><input type="email" id="f-email" name="email" autocomplete="email" placeholder="'+esc(t('bk.field.email.placeholder'))+'" /></div></div><div class="form-row single"><div class="field"><label for="f-notes">'+esc(t('bk.field.notes'))+'</label><textarea id="f-notes" name="notes" placeholder="'+esc(t('bk.field.notes.placeholder'))+'"></textarea></div></div></div>'+
      '<div class="form-foot"><button class="submit-btn" type="submit">'+esc(t('bk.submit'))+'<span class="arr">&rarr;</span></button><p class="demo-note">'+esc(t('bk.demo.label'))+' - '+esc(t('bk.demo.body'))+'</p></div></form><aside class="summary" id="summary">'+renderSummary(null,null,ci,co,adults,kids)+'</aside></div></section>';
    bind(roomParam);
    if(hotelId){ var h=HOTELS.find(function(x){return x.id===hotelId;}); if(h){ document.getElementById('f-hotel').value=hotelId; populateRooms(h, roomParam); updateSummary(); } }
  }
  function populateRooms(hotel, roomNameParam){
    var sel=document.getElementById('f-room'); if(!sel) return;
    if(!hotel || !hotel.rooms){ sel.innerHTML='<option value="">'+esc(t('bk.field.room.placeholder'))+'</option>'; sel.disabled=true; return; }
    var html='<option value="">'+esc(t('bk.field.room.placeholder'))+'</option>';
    hotel.rooms.forEach(function(r,i){ var add=typeof r.weekday==='number'&&r.weekday>0?' (+'+r.weekday+')':''; var selected=roomNameParam && r.name===roomNameParam ? ' selected' : ''; html+='<option value="'+i+'"'+selected+'>'+esc(roomName(r))+add+'</option>'; });
    sel.innerHTML=html; sel.disabled=false;
  }
  function updateSummary(){
    var hotel=getSelectedHotel(); var room=getSelectedRoom(); var ci=parse(document.getElementById('f-checkin').value); var co=parse(document.getElementById('f-checkout').value); var ad=parseInt(document.getElementById('f-adults').value,10)||2; var kd=parseInt(document.getElementById('f-kids').value,10)||0;
    document.getElementById('summary').innerHTML=renderSummary(hotel,room,ci,co,ad,kd);
  }
  function bind(roomParam){
    document.querySelectorAll('.counter').forEach(function(box){ var key=box.dataset.counter; var min=Number(box.dataset.min); var max=Number(box.dataset.max); var cv=box.querySelector('.cv'); var hidden=document.getElementById('f-'+key); box.querySelectorAll('button').forEach(function(btn){ btn.addEventListener('click', function(){ var next=Math.max(min, Math.min(max, Number(hidden.value)+Number(btn.dataset.step))); hidden.value=next; cv.textContent=next; updateSummary(); }); }); });
    var hotelSel=document.getElementById('f-hotel'); hotelSel.addEventListener('change', function(){ var hotel=getSelectedHotel(); populateRooms(hotel, null); updateSummary(); });
    ['f-room','f-checkin','f-checkout'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(){ var ci=parse(document.getElementById('f-checkin').value); var co=parse(document.getElementById('f-checkout').value); if(ci && co && co<=ci){ var n=new Date(ci); n.setDate(n.getDate()+1); document.getElementById('f-checkout').value=fmt(n); } if(ci) document.getElementById('f-checkout').min=fmt(ci); updateSummary(); }); });
    document.getElementById('booking-form').addEventListener('submit', function(e){ e.preventDefault(); var required=['f-hotel','f-room','f-checkin','f-checkout','f-name','f-phone']; var ok=true; required.forEach(function(id){ var el=document.getElementById(id); var bad=!el.value; el.closest('.field').classList.toggle('is-error', bad); if(bad) ok=false; }); if(!ok) return; var name=document.getElementById('f-name').value || ''; var order='HA-'+Math.random().toString(36).slice(2,8).toUpperCase(); main.innerHTML='<section class="booking-shell success"><div class="success-card"><div class="check">✓</div><h1>'+esc(t('bk.success.h1', { name: name }))+'</h1><p>'+esc(t('bk.success.lead'))+'</p><div class="order-no"><span>'+esc(t('bk.success.orderId'))+'</span><b>'+order+'</b></div><a class="btn btn-primary" href="home-around-website-mockup-24.html">'+esc(t('bk.success.cta.home'))+'</a></div></section>'; });
  }
  render();
})();
</script>
