<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>房型搜尋 — Home Around Taiwan Tours</title>
<style>
  /* Tokens */
  :root {
    --bg:        oklch(96.5% 0.012 80);
    --surface:   oklch(100% 0 0);
    --cream:     oklch(98% 0.05 95);
    --fg:        oklch(20% 0.012 60);
    --brown:     oklch(34% 0.018 60);
    --muted:     oklch(48% 0.012 60);
    --border:    oklch(82% 0.008 60);
    --hairline:  oklch(82% 0.008 60 / 0.7);
    --teal:      oklch(67% 0.09 185);
    --yellow:    oklch(82% 0.16 88);
    --green:     oklch(74% 0.13 130);
    --danger:    oklch(58% 0.18 30);

    --font-display: 'Noto Serif TC', 'Tiempos Headline', 'Newsreader', 'Iowan Old Style', Georgia, serif;
    --font-body:    'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Inter', 'Microsoft JhengHei', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace;

    --maxw: 1280px;
    --pad-x: clamp(20px, 4vw, 48px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--fg); background: var(--bg);
    font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .container { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad-x); }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal); }

  /* Navigation */
  .nav { position: sticky; top: 0; z-index: 50; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--hairline); }
  .nav-inner { display: flex; align-items: center; height: 88px; gap: 28px; }
  .nav-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-right: 12px; }
  .nav-logo img { height: 60px; width: auto; }
  .nav-links { display: flex; align-items: center; gap: 18px; font-size: 13.5px; color: var(--brown); white-space: nowrap; flex: 1; min-width: 0; }
  .nav-links a { position: relative; padding: 6px 0; transition: color .2s; }
  .nav-links a:hover { color: var(--teal); }
  .nav-cta { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .nav-lang { display: inline-flex; align-items: center; gap: 0; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  .nav-lang .sep { margin: 0 4px; opacity: 0.5; pointer-events: none; }
  .lang-btn { background: transparent; border: 0; padding: 4px; font: inherit; color: var(--muted); cursor: pointer; line-height: 1; border-radius: 3px; transition: color .15s; }
  .lang-btn:hover { color: var(--brown); }
  .lang-btn.is-active { color: var(--brown); font-weight: 700; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 22px; border-radius: 10px; font-size: 14.5px; font-weight: 600; border: 1px solid transparent; transition: all .2s; }
  .btn-primary { background: var(--yellow); color: var(--fg); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px -6px oklch(82% 0.16 88 / 0.6); }

  /* ??? PAGE HEAD ?????????????????????????????????????????? */
  .page-head {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    padding: 32px 0 28px;
  }
  .breadcrumb {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .breadcrumb a:hover { color: var(--brown); }
  .breadcrumb .sep { margin: 0 8px; opacity: 0.4; }
  .page-head h1 {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(28px, 3.4vw, 40px);
    color: var(--brown); margin: 0 0 6px; letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .page-head .sub {
    color: var(--muted); font-size: 14.5px;
    max-width: 56ch;
  }

  /* ??? FILTER BAR (? chip ?? ????????????????????????? */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    position: sticky; top: 88px; z-index: 30;
  }
  .filter-row {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 13.5px; color: var(--brown);
    transition: border-color .15s;
  }
  .chip b {
    font-weight: 600; color: var(--brown);
    font-variant-numeric: tabular-nums;
  }
  .chip .label {
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-right: 2px;
  }
  .chip.editable:hover { border-color: var(--teal); cursor: pointer; }
  .filter-row .spacer { flex: 1; }
  .filter-edit-link {
    color: var(--brown); font-size: 13.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 0;
    border-bottom: 1.5px solid transparent;
    transition: border-color .15s, color .15s;
  }
  .filter-edit-link:hover { color: var(--teal); border-color: var(--teal); }
  .filter-edit-link::before { content: "←"; transition: transform .2s; }
  .filter-edit-link:hover::before { transform: translateX(-3px); }

  /* ??? SUMMARY ??????????????????????????????????????????? */
  .results-summary {
    padding: 28px 0 14px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .results-summary .count {
    font-family: var(--font-display); font-weight: 400;
    font-size: 22px; color: var(--brown);
    letter-spacing: -0.005em;
  }
  .results-summary .count b { font-weight: 500; color: var(--teal); }
  .results-summary .legend {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.1em; color: var(--muted);
  }

  /* ??? ROOMS LIST ???????????????????????????????????????? */
  .rooms-list { padding-bottom: 64px; display: grid; gap: 18px; }
  .room-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 280px 1fr auto;
    gap: 0;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .room-card:hover {
    transform: translateY(-2px);
    border-color: oklch(67% 0.09 185 / 0.5);
    box-shadow: 0 14px 32px -22px oklch(20% 0.012 60 / 0.18);
  }
  .room-photo {
    aspect-ratio: 4/3;
    position: relative;
    overflow: hidden;
  }
  .room-photo .ph-x { position: absolute; inset: 0; }
  .room-photo .room-tag {
    position: absolute; top: 12px; left: 12px;
    background: var(--surface); color: var(--brown);
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 3px;
    border: 1px solid var(--hairline);
  }
  .room-photo .room-tag.teal { background: var(--teal); color: white; border-color: transparent; }
  .room-photo .room-tag.family { background: var(--green); color: oklch(20% 0.05 130); border-color: transparent; }

  .hp-warm   { background: linear-gradient(135deg, oklch(38% 0.04 50) 0%, oklch(64% 0.08 70) 50%, oklch(86% 0.10 80) 100%); }
  .hp-ocean  { background: linear-gradient(135deg, oklch(28% 0.04 220) 0%, oklch(54% 0.08 195) 60%, oklch(82% 0.06 195) 100%); }
  .hp-island { background: linear-gradient(135deg, oklch(56% 0.10 195) 0%, oklch(82% 0.06 195) 50%, oklch(90% 0.04 90) 100%); }
  .hp-forest { background: linear-gradient(135deg, oklch(34% 0.05 140) 0%, oklch(58% 0.09 130) 60%, oklch(82% 0.10 110) 100%); }
  .hp-urban  { background: linear-gradient(135deg, oklch(18% 0.02 60) 0%, oklch(36% 0.05 55) 60%, oklch(56% 0.10 60) 100%); }
  .hp-sunset { background: linear-gradient(135deg, oklch(38% 0.08 30) 0%, oklch(62% 0.16 50) 60%, oklch(84% 0.14 80) 100%); }

  .room-body {
    padding: 24px 26px 22px;
    border-left: 1px solid var(--hairline);
    display: flex; flex-direction: column; gap: 8px;
    min-width: 0;
  }
  .room-hotel-row {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap;
  }
  .room-hotel-row a {
    color: var(--brown); text-decoration: none;
    transition: color .15s;
    border-bottom: 1px dotted var(--hairline);
  }
  .room-hotel-row a:hover { color: var(--teal); border-bottom-color: var(--teal); }
  .room-hotel-row .sep { opacity: 0.4; }
  .room-name {
    font-family: var(--font-display); font-weight: 500;
    font-size: 22px; color: var(--brown);
    margin: 0; line-height: 1.2;
  }
  .room-en {
    color: var(--muted); font-style: italic; font-size: 13px;
    margin-bottom: 4px;
  }
  .room-features {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 6px;
    font-size: 13px; color: var(--muted);
  }
  .room-feature { display: inline-flex; align-items: center; gap: 6px; }
  .room-feature svg { flex-shrink: 0; opacity: 0.7; }
  .price-breakdown {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
    font-family: var(--font-mono); font-size: 11.5px;
    letter-spacing: 0.04em; color: var(--muted);
    line-height: 1.6;
  }
  .price-breakdown .row { display: flex; justify-content: space-between; gap: 16px; }
  .price-breakdown .row.sub { color: oklch(60% 0.012 60); }
  .price-breakdown .row.total { color: var(--brown); margin-top: 4px; padding-top: 4px; border-top: 1px dotted var(--hairline); font-weight: 600; }

  .room-cta-col {
    padding: 24px 26px;
    border-left: 1px solid var(--hairline);
    background: var(--cream);
    display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between;
    gap: 14px; min-width: 240px;
  }
  .price-block { text-align: right; }
  .price-block .from {
    font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }
  .price-block .total {
    font-family: var(--font-display); font-weight: 500;
    font-size: 32px; color: var(--brown); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .price-block .total sup {
    font-size: 14px; vertical-align: top;
    margin-right: 2px; color: var(--muted);
  }
  .price-block .for-stay {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.06em; color: var(--muted);
    margin-top: 6px;
  }
  .room-select {
    background: var(--yellow); color: var(--fg);
    border: 0; padding: 12px 22px; border-radius: 100px;
    font-size: 14px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 8px;
    transition: filter .15s, transform .2s;
    width: 100%; justify-content: center;
  }
  .room-select::after { content: "→"; transition: transform .2s; }
  .room-select:hover { filter: brightness(1.06); }
  .room-select:hover::after { transform: translateX(3px); }

  .room-card.is-package .price-block .total {
    font-size: 22px; color: var(--muted);
  }
  .room-card.is-package .room-select {
    background: transparent; color: var(--brown);
    border: 1px solid var(--border);
  }
  .room-card.is-package .room-select:hover { border-color: var(--brown); }

  /* Empty state */
  .empty {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 56px 32px;
    text-align: center;
    color: var(--muted);
  }
  .empty h3 {
    font-family: var(--font-display); font-weight: 500;
    font-size: 22px; color: var(--brown);
    margin: 0 0 10px;
  }
  .empty p { margin: 0 0 18px; max-width: 48ch; margin-inline: auto; line-height: 1.65; }
  .empty .empty-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border: 1px solid var(--brown);
    border-radius: 100px; font-size: 14px; font-weight: 600;
    color: var(--brown); transition: all .2s;
  }
  .empty .empty-cta:hover { background: var(--brown); color: oklch(98% 0.05 95); }

  /* ??? FOOTER ???????????????????????????????????????????? */
  footer { background: oklch(28% 0.018 60); color: oklch(80% 0.012 60); padding: 60px 0 28px; margin-top: 64px; }
  .foot-grid { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid oklch(40% 0.018 60); }
  .foot-brand { display: flex; align-items: center; gap: 16px; }
  .foot-brand img { height: 56px; width: auto; }
  .foot-brand .tag { color: oklch(78% 0.012 60); font-size: 13px; max-width: 32ch; line-height: 1.5; }
  .foot-bottom { padding-top: 22px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: oklch(65% 0.012 60); }

  /* ??? DEMO BAR ?????????????????????????????????????????? */
  .demo-bar {
    background: var(--brown); color: oklch(98% 0.05 95);
    padding: 12px 0;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.06em;
    text-align: center;
  }
  .demo-bar b { color: var(--yellow); font-weight: 600; letter-spacing: 0.1em; }

  /* ??? RESPONSIVE ???????????????????????????????????????? */
  @media (max-width: 1024px) {
    .room-card { grid-template-columns: 220px 1fr; }
    .room-cta-col {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      border-left: 0;
      border-top: 1px solid var(--hairline);
      min-width: 0;
    }
    .price-block { text-align: left; }
    .room-select { width: auto; padding: 10px 22px; }
    .nav-links { gap: 12px; font-size: 12.5px; }
    .nav-lang { display: none; }
  }
  @media (max-width: 640px) {
    .nav-links { display: none; }
    .room-card { grid-template-columns: 1fr; }
    .room-photo { aspect-ratio: 16/9; }
    .room-body { border-left: 0; border-top: 1px solid var(--hairline); }
    .room-cta-col { flex-direction: column; align-items: stretch; gap: 12px; }
    .price-block { text-align: left; }
    .room-select { width: 100%; }
    .filter-row { gap: 8px; }
    .chip { padding: 7px 12px; font-size: 12.5px; }
  }

  /* ?????????????????????????????????????????????????
     SYNC: 擐? -24.html ??璈?nav + 768px mobile menu
     ???粹???銝?日??Ｘ??nav 璅??
     ????????????????????????????????????????????????? */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in oklch, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--hairline);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    height: 96px;
    gap: 28px;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-right: 12px;
  }
  .nav-logo img { height: 66px; width: auto; }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13.5px;
    color: var(--brown);
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .nav-links a {
    position: relative;
    padding: 6px 0;
    transition: color .2s ease-out;
  }
  .nav-links a:hover { color: var(--teal); }
  .nav-links a.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 1.5px;
    background: var(--brown);
  }
  .nav-cta {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .nav-lang {
    display: inline-flex;
    align-items: center;
    gap: 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .nav-lang .sep { margin: 0 4px; opacity: 0.5; pointer-events: none; }
  .lang-btn {
    background: transparent;
    border: 0;
    padding: 4px 4px;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    border-radius: 3px;
    transition: color .15s ease-out;
  }
  .lang-btn:hover { color: var(--brown); }
  .lang-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .lang-btn.is-active { color: var(--brown); font-weight: 700; }

  @media (max-width: 1280px) {
    .nav-links { gap: 14px; font-size: 13px; }
  }
  @media (max-width: 1024px) {
    .nav-lang { display: none; }
    .nav-links { gap: 12px; font-size: 12.5px; }
  }
  @media (max-width: 640px) {
    .nav-links { display: none; }
  }

  /* NAV REFINE ??摨蝐唾蝝圈?蝺?#FAEEDA 銝?潦??桐??對?
     nav ?湧?擃漲敺銝? 8px?H繚EN繚JP ???唾??踴?蝝?甇交憭扼蔭銝?*/
  .nav { border-bottom: 1.5px solid #FAEEDA; }
  .nav-inner { height: 104px; }
  .nav-links { justify-content: center; gap: 26px; font-size: 16px; }
  .nav-lang { font-size: 14px; }
  .lang-btn { padding: 6px 10px; font-size: 14px; }
  .nav .btn-primary { height: 48px; font-size: 15px; padding: 0 26px; border-radius: 12px; }
  @media (max-width: 1280px) { .nav-links { font-size: 15px; gap: 20px; } }
  @media (max-width: 1024px) {
    .nav-links { font-size: 14px; gap: 16px; }
    .nav-inner { height: 96px; }
    .nav-lang { font-size: 13px; }
    .lang-btn { padding: 5px 8px; font-size: 13px; }
    .nav .btn-primary { height: 44px; font-size: 14px; padding: 0 22px; }
  }
  /* ??? /SYNC ??? */
</style>

<body>

  <div class="demo-bar">
    <b data-i18n="rooms.demo.label">DEMO</b>
    <span data-i18n="rooms.demo.body">本頁為示意稿，所有房型圖片以漸層色塊代替；點擊「選擇此房型」進入訂房表單。</span>
  </div>

  <!-- NAV: aligned with home-around-website-mockup-24.html -->

  <script src="i18n.js"></script>
  <script src="hotels-data.js"></script>
  <script>
  /*
     rooms.html flow:
     1. Read hotel/checkin/checkout/adults/kids from URL.
     2. Filter matching rooms by capacity and destination.
     3. Calculate voucher-based weekday/weekend pricing.
     4. Render room cards and send selected room data to booking.html.
     5. Re-render when locale changes.
  */
  (function(){
    'use strict';

    if (window.I18N) window.I18N.applyToDom();

    var I = window.I18N;
    var HOTELS = window.HOTELS || [];
    var BY_ID = window.HOTELS_BY_ID || {};
    var BASE_VOUCHER = 2800;

    // ?? 1. 霈 URL ? ????????????????????????????????????
    function getParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
    }
    function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s); }

    var rawHotelId = getParam('hotel');
    var rawCheckin = getParam('checkin');
    var rawCheckout = getParam('checkout');
    var rawAdults = parseInt(getParam('adults'), 10);
    var rawKids = parseInt(getParam('kids'), 10);

    // ?身?潸?朣?蝣箔??喃蝙鋆賊脣銋撅內
    var today = new Date(); today.setHours(0,0,0,0);
    function fmtDate(d){
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,'0');
      var dd = String(d.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + dd;
    }
    var defCi = new Date(today); defCi.setDate(today.getDate() + 1);
    var defCo = new Date(defCi); defCo.setDate(defCi.getDate() + 2);

    var hotelId = (rawHotelId && BY_ID[rawHotelId]) ? rawHotelId : '';
    var checkin = isYmd(rawCheckin) ? rawCheckin : fmtDate(defCi);
    var checkout = isYmd(rawCheckout) ? rawCheckout : fmtDate(defCo);
    if (checkout <= checkin) {
      var d = new Date(checkin); d.setDate(d.getDate() + 1);
      checkout = fmtDate(d);
    }
    var adults = (rawAdults >= 1 && rawAdults <= 8) ? rawAdults : 2;
    var kids = (rawKids >= 0 && rawKids <= 6) ? rawKids : 0;
    var totalGuests = adults + kids;

    // ?? 2. 撟喳??亙??賂??曹??勗?乩??箏??伐??望?勗??箏像?伐???
    function nightsBreakdown(ciStr, coStr) {
      var ci = new Date(ciStr + 'T00:00:00');
      var co = new Date(coStr + 'T00:00:00');
      var nights = Math.round((co - ci) / (1000*60*60*24));
      var weekday = 0, weekend = 0;
      for (var i = 0; i < nights; i++) {
        var d = new Date(ci); d.setDate(ci.getDate() + i);
        var dow = d.getDay(); // 0=Sun ... 5=Fri 6=Sat
        if (dow === 5 || dow === 6) weekend++; else weekday++;
      }
      return { total: nights, weekday: weekday, weekend: weekend };
    }
    var nights = nightsBreakdown(checkin, checkout);

    // ?? 3. 摰寥??冽 (銝剜? / ?望??踹??賣?? ???????????????
    function roomCapacity(roomName, en) {
      var s = (roomName || '') + ' ' + (en || '');
      if (/六人|6\s*(人|people|guests)|six|6-bed/i.test(s)) return 6;
      if (/四人|家庭|4\s*(人|people|guests)|family|quad|four/i.test(s)) return 4;
      if (/三人|3\s*(人|people|guests)|triple|three/i.test(s)) return 3;
      if (/雙人|二人|兩人|2\s*(人|people|guests)|double|twin|cabin/i.test(s)) return 2;
      return 2;
    }

    // ?? 4. ?寞閮?嚗銝?踹?嚗???????????????????????????
    // ?嚗 total, perNight, isPackage, surchargeWeekday, surchargeWeekend, weekday, weekend, basePerNight }
    function calcRoomPrice(room, breakdown) {
      var sw = room.weekday;
      var se = room.weekend;
      var isPackageWeekend = typeof se === 'string';
      var swNum = (typeof sw === 'number') ? sw : 0;
      var seNum = (typeof se === 'number') ? se : 0;

      var weekdayCost = (BASE_VOUCHER + swNum) * breakdown.weekday;
      var weekendCost = (BASE_VOUCHER + seNum) * breakdown.weekend;
      var total = weekdayCost + weekendCost;

      return {
        total: total,
        weekdayCost: weekdayCost,
        weekendCost: weekendCost,
        surchargeWeekday: swNum,
        surchargeWeekend: seNum,
        isPackage: isPackageWeekend && breakdown.weekend > 0,
        packageNote: isPackageWeekend ? se : null
      };
    }

    // ?? 5. 蝭拚銝衣?皜 ?????????????????????????????
    function getCandidates() {
      // 靘?嚗?摰?hotel 撠勗?摰塚??血????hotel
      var sourceHotels = hotelId ? [BY_ID[hotelId]].filter(Boolean) : HOTELS.slice();

      var out = [];
      sourceHotels.forEach(function(h){
        (h.rooms || []).forEach(function(r){
          var cap = roomCapacity(r.name, r.en);
          if (cap < totalGuests) return; // 摰寥?銝雲
          var price = calcRoomPrice(r, nights);
          out.push({
            hotel: h, room: r, capacity: cap, price: price
          });
        });
      });

      // Sort available rooms first, then by total price.
      out.sort(function(a, b){
        if (a.price.isPackage !== b.price.isPackage) return a.price.isPackage ? 1 : -1;
        if (a.price.total !== b.price.total) return a.price.total - b.price.total;
        return a.capacity - b.capacity;
      });

      return out;
    }

    // ?? 6. 撌亙嚗TML escape & ?詨??澆? ???????????????????
    function escapeHtml(s){
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function nf(n) {
      return (n || 0).toLocaleString('en-US');
    }
    function dateLabel(s) {
      // YYYY-MM-DD ??"5/6 (Tue)"
      if (!isYmd(s)) return s;
      var d = new Date(s + 'T00:00:00');
      var DOW_ZH = ['日','一','二','三','四','五','六'];
      var DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var DOW_JA = ['日','月','火','水','木','金','土'];
      var lang = (I && I.current) || 'zh';
      var labelDow = lang === 'en' ? DOW_EN[d.getDay()]
                  : lang === 'ja' ? DOW_JA[d.getDay()]
                  : DOW_ZH[d.getDay()];
      return (d.getMonth()+1) + '/' + d.getDate() + ' (' + labelDow + ')';
    }

    function tt(key, fb) {
      // ??i18n key嚗??停 fallback
      if (!I) return fb;
      var v = I.t(key);
      return v === key ? fb : v;
    }

    // ?? 7. 皜脫? ??????????????????????????????????????????
    function renderFilterRow() {
      var row = document.getElementById('filterRow');
      if (!row) return;
      var spacer = row.querySelector('.spacer');
      var editLink = row.querySelector('.filter-edit-link');
      // 只清掉動態 chip，保留 spacer 與修改搜尋連結。
      var children = Array.from(row.children);
      children.forEach(function(c){
        if (c !== spacer && c !== editLink) row.removeChild(c);
      });

      var hotelLabel = hotelId
        ? (I && I.hotelName ? I.hotelName(BY_ID[hotelId]) : BY_ID[hotelId].name)
        : tt('rooms.chip.hotel.any', '全部旅宿');
      var nightsLabel = nights.total + ' ' + tt('rooms.nights', '晚');
      var guestsLabel = adults + ' ' + tt('search.adults', '憭找犖')
        + (kids > 0 ? ' · ' + kids + ' ' + tt('search.kids', '兒童') : '');

      var html =
        '<span class="chip">' +
          '<span class="label">' + escapeHtml(tt('rooms.chip.where', '地點')) + '</span>' +
          '<b>' + escapeHtml(hotelLabel) + '</b>' +
        '</span>' +
        '<span class="chip">' +
          '<span class="label">' + escapeHtml(tt('rooms.chip.dates', '日期')) + '</span>' +
          '<b>' + escapeHtml(dateLabel(checkin)) + ' - ' + escapeHtml(dateLabel(checkout)) + '</b>' +
          '<span class="num" style="color: var(--muted); font-size: 12px;"> · ' + escapeHtml(nightsLabel) + '</span>' +
        '</span>' +
        '<span class="chip">' +
          '<span class="label">' + escapeHtml(tt('rooms.chip.guests', '人數')) + '</span>' +
          '<b class="num">' + escapeHtml(guestsLabel) + '</b>' +
        '</span>';

      // ??chips ? spacer 銋?
      var temp = document.createElement('div');
      temp.innerHTML = html;
      while (temp.firstChild) row.insertBefore(temp.firstChild, spacer);
    }

    function renderResults() {
      var listEl = document.getElementById('roomsList');
      var countEl = document.getElementById('resultsCount');
      if (!listEl || !countEl) return;

      var items = getCandidates();

      // count line
      var nResult = items.filter(function(it){ return !it.price.isPackage; }).length;
      var template = tt('rooms.count', '找到 {n} 個可訂房型');
      countEl.innerHTML = template.replace('{n}', '<b>' + nResult + '</b>');

      if (items.length === 0) {
        listEl.innerHTML =
          '<div class="empty">' +
            '<h3>' + escapeHtml(tt('rooms.empty.title', '沒有符合條件的房型')) + '</h3>' +
            '<p>' + escapeHtml(tt('rooms.empty.body',
              '請調整入住日期或人數，再重新搜尋。')) + '</p>' +
            '<a href="home-around-website-mockup-24.html#searchForm" class="empty-cta">' +
              escapeHtml(tt('rooms.modifySearch', '修改搜尋')) + ' →' +
            '</a>' +
          '</div>';
        return;
      }

      // build cards
      var html = items.map(function(it){
        var h = it.hotel, r = it.room, p = it.price;
        var hotelName = (I && I.hotelName) ? I.hotelName(h) : h.name;
        var roomDispName = (I && I.roomName) ? I.roomName(r) : r.name;
        var regionLabel = (I && I.regionName) ? I.regionName(h.region) : h.region;
        var theme = h.theme || 'warm';

        /* ?迨?踹 hotel.rooms ??index嚗??箸?摮????宏??
           霈?銝?ㄞ摨???＊蝷箔?????踹???閫??*/
        var rIdx = (h.rooms || []).indexOf(r);
        var photosForHotel = window.getHotelPhotos ? window.getHotelPhotos(h, 5) : [];
        var roomPhoto = photosForHotel[(rIdx >= 0 ? rIdx : 0) % (photosForHotel.length || 1)] || h.photo;
        var photoStyle = roomPhoto
          ? ' style="background-image:url(\'' + roomPhoto + '\'); background-size:cover; background-position:center;"'
          : '';

        // 標示旅宿特色：親子友善 / 溫泉 / 海景海岸。
        var badge = null;
        if ((h.tags || []).some(function(t){ return /親子|家庭|庭園|寵物友善/.test(t); })) {
          badge = { cls: 'family', text: tt('all.badge.family', '親子友善') };
        } else if ((h.tags || []).some(function(t){ return /溫泉/.test(t); })) {
          badge = { cls: 'teal', text: tt('all.badge.spring', '溫泉') };
        } else if ((h.tags || []).some(function(t){ return /海景|海岸|南灣|海島|離島/.test(t); })) {
          badge = { cls: 'teal', text: tt('all.badge.coast', '海景') };
        }

        // 摰寥? icon (鈭箏耦 svg)
        var personSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        var bedSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M2 16h20"/><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"/></svg>';
        var calSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

        // price breakdown text (mono)
        var bdParts = [];
        if (nights.weekday > 0) {
          var wkLine = tt('rooms.bd.weekday', '平日 +{add} × {n} 晚')
            .replace('{add}', nf(p.surchargeWeekday))
            .replace('{n}', nights.weekday);
          bdParts.push(
            '<div class="row sub">' +
              '<span>' + escapeHtml(wkLine) + '</span>' +
              '<span>NT$' + nf(p.weekdayCost) + '</span>' +
            '</div>'
          );
        }
        if (nights.weekend > 0) {
          if (p.isPackage) {
            var pkgLine = tt('rooms.bd.package', '假日 {note}（請洽客服）')
              .replace('{note}', p.packageNote || '');
            bdParts.push(
              '<div class="row sub" style="color: var(--danger);">' +
                '<span>' + escapeHtml(pkgLine) + '</span>' +
              '</div>'
            );
          } else {
            var weLine = tt('rooms.bd.weekend', '假日 +{add} × {n} 晚')
              .replace('{add}', nf(p.surchargeWeekend))
              .replace('{n}', nights.weekend);
            bdParts.push(
              '<div class="row sub">' +
                '<span>' + escapeHtml(weLine) + '</span>' +
                '<span>NT$' + nf(p.weekendCost) + '</span>' +
              '</div>'
            );
          }
        }
        var voucherCount = nights.total;
        bdParts.push(
          '<div class="row total">' +
            '<span>' + escapeHtml(tt('rooms.bd.voucherCount', '使用張數')) + '</span>' +
            '<span class="num">' + voucherCount + ' ' + escapeHtml(tt('rooms.bd.vouchers', '張')) + '</span>' +
          '</div>'
        );

        var cardClass = p.isPackage ? 'room-card is-package' : 'room-card';
        var totalDisplay = p.isPackage
          ? '<span style="font-size: 16px;">' + escapeHtml(tt('rooms.priceUnavailable', '請洽客服')) + '</span>'
          : '<sup>NT$</sup>' + nf(p.total);
        var ctaText = p.isPackage
          ? tt('rooms.cta.unavailable', '請聯絡客服')
          : tt('rooms.cta.select', '選擇此房型');

        // Build booking URL for the selected room.
        var bookParams = new URLSearchParams();
        bookParams.set('hotel', h.id);
        bookParams.set('room', r.name);
        bookParams.set('checkin', checkin);
        bookParams.set('checkout', checkout);
        bookParams.set('adults', String(adults));
        if (kids > 0) bookParams.set('kids', String(kids));
        var bookUrl = 'booking.html?' + bookParams.toString();

        return '' +
          '<article class="' + cardClass + '" data-hotel="' + escapeHtml(h.id) + '" data-room="' + escapeHtml(r.name) + '">' +
            '<div class="room-photo">' +
              '<div class="ph-x hp-' + escapeHtml(theme) + '"' + photoStyle + '></div>' +
              (badge ? '<span class="room-tag ' + badge.cls + '">' + escapeHtml(badge.text) + '</span>' : '') +
            '</div>' +
            '<div class="room-body">' +
              '<div class="room-hotel-row">' +
                '<a href="hotel-detail.html?id=' + escapeHtml(h.id) + '">' + escapeHtml(hotelName) + '</a>' +
                '<span class="sep">·</span>' +
                '<span>' + escapeHtml(regionLabel) + '</span>' +
              '</div>' +
              '<h3 class="room-name">' + escapeHtml(roomDispName) + '</h3>' +
              (r.en && I && I.current === 'zh'
                ? '<div class="room-en">' + escapeHtml(r.en) + '</div>'
                : '') +
              '<div class="room-features">' +
                '<span class="room-feature">' + personSvg +
                  ' <span>' + escapeHtml(tt('rooms.feature.capacity', '可住')) +
                  ' <b class="num">' + it.capacity + '</b> ' + escapeHtml(tt('rooms.feature.people', '人')) +
                  '</span>' +
                '</span>' +
                '<span class="room-feature">' + bedSvg +
                  ' <span>' + escapeHtml(tt('rooms.feature.series', '精緻系列')) + '</span>' +
                '</span>' +
                '<span class="room-feature">' + calSvg +
                  ' <span class="num">' + nights.total + ' ' + escapeHtml(tt('rooms.feature.nights', '晚')) + '</span>' +
                '</span>' +
              '</div>' +
              '<div class="price-breakdown">' + bdParts.join('') + '</div>' +
            '</div>' +
            '<div class="room-cta-col">' +
              '<div class="price-block">' +
                '<div class="from">' + escapeHtml(tt('rooms.from', '總價')) + '</div>' +
                '<div class="total">' + totalDisplay + '</div>' +
                '<div class="for-stay">' + escapeHtml(tt('rooms.forStay', '入住 {n} 晚').replace('{n}', nights.total)) + '</div>' +
              '</div>' +
              '<button type="button" class="room-select" data-href="' + escapeHtml(bookUrl) + '"' +
                (p.isPackage ? ' disabled' : '') + '>' +
                escapeHtml(ctaText) +
              '</button>' +
            '</div>' +
          '</article>';
      }).join('');

      listEl.innerHTML = html;

      // 使用隱藏 anchor 觸發導向，避開部分 preview iframe 對 location.href 的限制。
      listEl.querySelectorAll('button.room-select').forEach(function(btn){
        if (btn.disabled) return;
        btn.addEventListener('click', function(){
          var url = btn.getAttribute('data-href');
          if (!url) return;
          var a = document.createElement('a');
          a.href = url;
          a.rel = 'noopener';
          a.style.position = 'absolute';
          a.style.left = '-9999px';
          document.body.appendChild(a);
          a.click();
          try { document.body.removeChild(a); } catch (_) {}
        });
      });
    }

    function renderAll() {
      renderFilterRow();
      renderResults();
    }

    renderAll();
    document.addEventListener('localechange', renderAll);
  })();
  </script>
  <script src="chat-booking-widget.js"></script>
  <script>
    window.HA_MOBILE_DRAWER_CONFIG = {
      active: 'rooms',
      mainLabel: 'Rooms'
    };
  </script>
  <script src="mobile-drawer.js"></script>
</body>
